html{scroll-behavior:smooth}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',Arial,sans-serif;font-weight:300;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-weight:300}
.eb{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--acd);line-height:1.5;margin-bottom:12px}
.t{font-family:'Spectral',Georgia,serif;font-style:italic;font-weight:300;line-height:1.1;letter-spacing:-.01em}
h2.t{font-size:clamp(30px,7vw,42px);margin-bottom:14px}
h1.t{font-size:clamp(34px,8vw,56px);line-height:1.06;margin-bottom:16px}
h3.sub{font-family:'Spectral',Georgia,serif;font-style:italic;font-weight:300;font-size:24px;line-height:1.2;margin:30px 0 12px}
.lead{font-size:17px;line-height:1.6;color:var(--tx);max-width:640px}
.mu{color:var(--mu)}
/* nav */
header.top{max-width:680px;margin:0 auto;padding:40px 24px 18px}
header.top h1{font-size:clamp(32px,7vw,50px);margin:0}
nav{max-width:680px;margin:0 auto;padding:0 24px}
.navin{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:18px;border-bottom:1px solid var(--ink)}
nav button{border:1px solid var(--ink);background:transparent;border-radius:30px;padding:5px 12px;font-size:12.5px;color:var(--ink);cursor:pointer;white-space:nowrap;transition:.25s}
nav button:hover{background:var(--ach);border-color:var(--ach)}
nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.in{max-width:680px;margin:0 auto;padding:0 24px}
.wide{max-width:680px;margin:0 auto;padding:0 24px}
.sec{padding:44px 0 36px}
.soft{background:var(--bg2);max-width:632px;margin:0 auto}
/* cover */
.cover{display:block;padding-top:24px}
.cvimg{width:calc(100% - 48px);max-width:632px;margin:0 auto;aspect-ratio:8/3;background:var(--bg2) var(--img1) center 60%/cover no-repeat}
.cvtxt{padding-top:30px;padding-bottom:34px}
.datecard{border:1px solid var(--frame);background:var(--surf);padding:5px;max-width:360px;margin-top:22px}
.datecard>div{border:1px solid var(--ln);padding:14px 16px}
/* inputs */
label.l{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--acd);margin:16px 0 6px}
input[type=text],input[type=date],textarea,select{width:100%;border:1px solid var(--ln);background:var(--surf);padding:11px 13px;font-size:16px;color:var(--ink);border-radius:0;transition:border-color .25s}
textarea{min-height:96px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--ink)}
input::placeholder,textarea::placeholder{color:#a79a8c}
select{width:auto;padding:7px 10px;font-size:14px}
input[type=checkbox],input[type=radio]{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:1px solid var(--ink);border-radius:50%;flex:none;cursor:pointer;background:transparent;transition:.2s;position:relative;padding:0}
input[type=checkbox]:checked,input[type=radio]:checked{background:var(--ac);border-color:var(--ac)}
input[type=checkbox]:checked::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid var(--ink);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
/* buttons */
.btn{display:inline-block;border:1px solid var(--ink);padding:13px 26px;font-size:14px;line-height:1.3;color:var(--ink);cursor:pointer;transition:background .28s,color .28s,border-color .28s;background:transparent}
.btn:hover{background:var(--ach);border-color:var(--ach);color:var(--ink)}
.btn.fill{background:var(--ink);color:var(--bg)}
.btn.fill:hover{background:var(--ach);color:var(--ink)}
.btn.sm{padding:6px 14px;font-size:12px;border-radius:30px}
.dash{border:1px dashed var(--acd);color:var(--acd);background:none;border-radius:30px;padding:6px 14px;font-size:12px;cursor:pointer;transition:.25s}
.dash:hover{background:var(--acd);color:#fff}
.x{border:1px solid var(--ink);background:transparent;border-radius:50%;width:24px;height:24px;font-size:13px;line-height:1;cursor:pointer;flex:none;color:var(--ink);transition:.2s}
.x:hover{background:var(--ink);color:var(--bg)}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--ink);border-radius:30px;padding:3px 11px;white-space:nowrap}
.tag.inv{background:var(--ink);color:var(--bg)}
.tag.ac{background:var(--ac);border-color:var(--ac)}
/* frame card (паспарту как в шаблоне) */
.fr{border:1px solid var(--frame);background:var(--surf);padding:5px;margin-bottom:18px}
.fr>.fi{border:1px solid var(--ln);padding:18px 20px}
/* path */
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.pcard{border-top:1px solid var(--ink);padding-top:12px;cursor:pointer}
.pcard b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:50px;line-height:1.15;color:var(--ink);font-feature-settings:'lnum' 1}
.pcard span{display:block;font-size:13px;color:var(--mu);line-height:1.4}
.pcard:hover b{color:var(--ac)}
.pcard h4{font-weight:400;font-size:15px;margin-bottom:2px}
/* opor */
.opor .st{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px;font-size:16px;line-height:1.45}
.opor .st:before{counter-increment:s;content:counter(s);flex:none;width:30px;height:30px;border:1px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;margin-top:-2px}
.opor{counter-reset:s}
.opor b{font-weight:400;display:block}
.opor span{color:var(--mu);font-size:14px}
/* dark statement */
.dark{background:linear-gradient(rgba(46,34,33,.84),rgba(46,34,33,.9)),var(--img2) center/cover;color:#F4E8E3;text-align:center;padding:64px 0;max-width:632px;margin:0 auto}
.dark .eb{color:#D98A7E}
.dark .big{font-family:'Spectral',Georgia,serif;font-style:italic;font-weight:300;font-size:clamp(24px,5.5vw,34px);line-height:1.3}
/* meters */
.mtr{display:flex;gap:14px;align-items:stretch;height:240px}
.mt{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;text-align:center;max-width:110px}
.mt .mv{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;line-height:1.2;font-feature-settings:'lnum' 1}
.mt .tb{width:16px;flex:1;border:1px solid var(--ink);border-radius:9px;position:relative;margin:8px 0;overflow:hidden}
.mt .tb i{position:absolute;left:0;right:0;bottom:0;background:var(--ac);transition:height .5s}
.mt .ml{font-size:12px;line-height:1.3;color:var(--mu);overflow-wrap:anywhere}
/* wishes */
.q{display:grid;grid-template-columns:64px 1fr;margin-bottom:6px;border-top:1px solid var(--ln);padding:20px 0}
.q .n{font-family:'Cormorant Garamond',Georgia,serif;font-size:48px;line-height:1;color:var(--ac);font-feature-settings:'lnum' 1}
.q p{font-family:'Spectral',Georgia,serif;font-style:italic;font-size:21px;line-height:1.25;margin-bottom:10px}
/* goals */
.gcard{margin-bottom:22px}
.gh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.warn{border-left:2px solid var(--ac);padding:4px 0 4px 16px;margin:14px 0;color:var(--tx)}
/* tree */
.tree{display:grid;grid-template-columns:1fr;gap:26px;margin-bottom:44px}
@media(max-width:760px){.tree{grid-template-columns:1fr}}
.root{align-self:start;border:1px solid var(--frame);background:var(--surf);padding:5px}
.root .im{height:84px;background:var(--bg2) center/cover}
.root .im.a{background-image:var(--img1)}.root .im.b{background-image:var(--img2)}
.root .tx{padding:14px 14px 16px}
.root .nm{font-family:'Spectral',Georgia,serif;font-style:italic;font-size:22px;line-height:1.2;margin:8px 0 10px;overflow-wrap:anywhere}
.root p{font-size:13px;color:var(--mu);line-height:1.4}
.bar{height:3px;background:var(--ln);position:relative;margin-top:10px}
.bar i{position:absolute;left:0;top:0;height:3px;background:var(--ac)}
.subs{position:relative;padding-left:30px;border-left:1px solid var(--ink)}
.ti{border:0!important;border-bottom:1px solid var(--ln)!important;background:transparent!important;font-family:'Spectral',Georgia,serif;font-style:italic;font-size:21px!important;padding:6px 2px!important}
.per{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acd);gap:8px;margin:10px 0 0}
.stp{margin:12px 0 4px 6px;padding-left:20px;border-left:1px dashed var(--ac)}
.stp .row{margin-bottom:8px;position:relative}
.stp .row::before{content:"";position:absolute;left:-20px;width:14px;border-top:1px dashed var(--ac)}
.stp input[type=text]{padding:7px 10px;font-size:15px}
/* timeline */
.scroll{overflow-x:auto}
table.tl{border-collapse:collapse;width:100%;min-width:780px;table-layout:fixed;font-size:12px}
table.tl th,table.tl td{border:1px solid var(--ln);height:32px;text-align:center;padding:2px}
table.tl th{font-weight:300;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);background:var(--surf);border-bottom:1px solid var(--ink)}
table.tl td.nm{width:200px;text-align:left;padding:4px 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surf)}
table.tl tr.g td{background:var(--bg2);font-family:'Spectral',Georgia,serif;font-style:italic;font-size:16px;text-align:left;padding:5px 10px}
table.tl td.f{background:var(--ac)}
table.tl td.fd{background:repeating-linear-gradient(45deg,var(--ach) 0 3px,var(--surf) 3px 7px)}
table.tl tr.cnt td{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;background:var(--surf);border-top:1px solid var(--ink)}
table.tl tr.cnt td.nm{font-family:'Inter';font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acd)}
table.tl td.warn{background:var(--acd);color:#fff}
/* reviews */
.mon{border-top:1px solid var(--ln);padding:22px 0}
.mon h3{display:flex;gap:14px;align-items:baseline;font-family:'Spectral',Georgia,serif;font-style:italic;font-weight:300;font-size:26px}
.mon h3 .nn{font-family:'Cormorant Garamond',Georgia,serif;font-style:normal;color:var(--ac);font-size:40px;line-height:1}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:760px){.g3{grid-template-columns:1fr}}
.g3 textarea{min-height:84px}
/* ai */
.qchat{border:1px solid var(--frame);background:var(--surf);padding:16px 18px 18px;margin:16px 0}
.qchat .qh{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.qchat .qh:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ac)}
.qchat pre{white-space:pre-wrap;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.6;max-height:380px;overflow:auto;color:var(--tx)}
.chip{border-top:1px solid var(--ln);padding:14px 0;display:flex;gap:14px;align-items:center;justify-content:space-between}
.chip:last-child{border-bottom:1px solid var(--ln)}
.chip span{font-size:15px;line-height:1.45}
.note{border-left:2px solid var(--ac);padding:2px 0 2px 18px;margin:18px 0}

.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-bottom:26px}
.z{padding:18px 12px;text-align:center;border:1px solid var(--frame)}
.z b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:30px;line-height:1.1;font-feature-settings:'lnum' 1}
.z span{font-size:12px;line-height:1.3;display:block}
.z1{background:var(--surf)}.z2{background:var(--ach);border-left:0}.z3{background:var(--ac);border-left:0}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;font-size:13px;display:none;z-index:50}
</style>
</head>
<body>
<header class="top"><div class="eb">12 месяцев · твой личный год</div><h1 class="t">Год радикальной мотивации</h1></header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="toast"></div>

<script>
const KEY='radicalYearWorkbook_v1';
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const Q1=[
 'Наличие чего в моей жизни через год сделает меня по-настоящему счастливой и целостной?',
 'Благодаря каким своим сильным качествам и скиллам я могу построить свою новую реальность?',
 'На какие сферы жизни я в этом году не буду тратить свою энергию, чтобы было больше ресурса на действительно важные цели?',
 'Что в моей жизни меня напрягает так сильно и так долго, что я готова именно в этот год радикально мотивировать себя изменить это навсегда?',
 'Что меня искренне триггерит в других людях, чему я «завидую» и это вызывает эмоции даже на физическом уровне?'
];
const TABS=[['start','Старт'],['s1','Шаг 1 · Желания'],['s2','Шаг 2 · Цели'],['rev','Как проверять себя'],['ai','Скопировать']];
const uid=()=>Math.random().toString(36).slice(2,9);
const newGoal=()=>({id:uid(),name:'',metric:'',weekly:'',subs:[]});
const newSub=()=>({id:uid(),title:'',when:'',steps:[]});
function setSubW(gid,sid,v){sub(gid,sid).when=v;save()}
function def(){return{tab:'start',start:'',wishes:['','','','',''],goals:[newGoal()],mainId:null,reviews:Array.from({length:12},()=>({bad:'',good:'',reward:''}))}}
function load(){try{const r=localStorage.getItem(KEY);if(r){return Object.assign(def(),JSON.parse(r))}}catch(e){}return def()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const G=id=>S.goals.find(g=>g.id===id);

function startD(){return S.start?new Date(S.start+'T00:00:00'):null}
function endD(){const d=startD();if(!d)return null;const e=new Date(d);e.setFullYear(e.getFullYear()+1);e.setDate(e.getDate()-1);return e}
const fmt=d=>d?String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear():'';
function mLabel(i){const d=startD();if(!d)return 'Месяц '+i;const m=(d.getMonth()+i-1);return MN[m%12]+' '+(d.getFullYear()+Math.floor(m/12))}
function mShort(i){const d=startD();if(!d)return String(i);return MN[(d.getMonth()+i-1)%12].slice(0,3)}
function subProg(s){if(s.done)return 1;if(s.steps.length)return s.steps.filter(x=>x.done).length/s.steps.length;return 0}
function goalProg(g){if(!g.subs.length)return 0;return Math.round(g.subs.reduce((a,s)=>a+subProg(s),0)/g.subs.length*100)}
function gname(g,i){return g.name.trim()||('Цель '+(i+1))}

function goTab(t){S.tab=t;save();render();window.scrollTo(0,0)}
function setStart(v){S.start=v;save();render()}
function setW(i,v){S.wishes[i]=v;save()}
function addGoal(){S.goals.push(newGoal());save();render()}
function delGoal(id){if(!confirm('Удалить цель вместе с подцелями?'))return;S.goals=S.goals.filter(g=>g.id!==id);if(S.mainId===id)S.mainId=null;save();render()}
function setGoal(id,f,v){G(id)[f]=v;save()}
function setMain(id){S.mainId=id;save();render()}
function addSub(gid){G(gid).subs.push(newSub());save();render()}
function delSub(gid,sid){const g=G(gid);g.subs=g.subs.filter(s=>s.id!==sid);save();render()}
function sub(gid,sid){return G(gid).subs.find(s=>s.id===sid)}
function setSubT(gid,sid,v){sub(gid,sid).title=v;save()}
function setSubM(gid,sid,f,v){const s=sub(gid,sid);s[f]=+v;if(s.to<s.from){if(f==='from')s.to=s.from;else s.from=s.to}save();render()}
function togSub(gid,sid){const s=sub(gid,sid);s.done=!s.done;save();render()}
function addStep(gid,sid){sub(gid,sid).steps.push({t:'',done:false});save();render()}
function setStep(gid,sid,i,v){sub(gid,sid).steps[i].t=v;save()}
function togStep(gid,sid,i){const s=sub(gid,sid);s.steps[i].done=!s.steps[i].done;save();render()}
function delStep(gid,sid,i){sub(gid,sid).steps.splice(i,1);save();render()}
function setRev(i,f,v){S.reviews[i][f]=v;save()}

const nextBtn=(t,l)=>`<div style="margin-top:34px"><button class="btn fill" onclick="goTab('${t}')">${l} &rarr;</button></div>`;
function monthOpts(sel){let o='';for(let i=1;i<=12;i++)o+=`<option value="${i}"${i===sel?' selected':''}>${i}. ${esc(mShort(i))}</option>`;return o}
const head=(eb,t,lead)=>`<div class="eb">${eb}</div><h2 class="t">${t}</h2>${lead?`<p class="lead">${lead}</p>`:''}`;

function vStart(){
  const e=endD();
  return `<section class="cover">
    <div class="cvimg"></div>
    <div class="in cvtxt">
      <p class="lead">12 месяцев, которые положат начало совершенно новой жизни, где много свободного времени, капитала, интересов. Это даст почву для будущего и станет стартом настоящей взрослой жизни, где есть место всем мечтам.</p>
    </div></section>
  <section class="sec soft"><div class="in"><div class="eb">на чём держится год</div>
    <div class="opor">
            <div class="st"><div><b>Не делать всё одновременно</b><span>2-3 месяца на одну цель, потом на другую</span></div></div>
      <div class="st"><div><b>Анализ</b><span>каждое первое число разбираем прошедший месяц</span></div></div>
      <div class="st"><div><b>Работа с искусственным интеллектом</b><span>проекты и цели живут в нейросети</span></div></div>
      <div class="st"><div><b>Первый месяц тестовый</b><span>цели можно перестроить через месяц или два</span></div></div>
      <div class="st"><div><b>Гибкость</b><span>тяжело, значит отдых, а потом возвращение</span></div></div>
    </div></div></section>
  <section class="dark"><div class="in"><div class="eb">главная мысль</div><p class="big">Дисциплина - это когда ты сходишь с дистанции сколько угодно раз, но всегда возвращаешься обратно</p></div></section>
  <section class="sec"><div class="wide">
    <div class="eb">путь по тетради</div>
    <div class="path">
      <div class="pcard" onclick="goTab('s1')"><b>1</b><h4>Желания</h4><span>5 вопросов про себя</span></div>
      <div class="pcard" onclick="goTab('s2')"><b>2</b><h4>Цели</h4><span>до 6 целей с метрикой</span></div>
      <div class="pcard" onclick="goTab('rev')"><b>3</b><h4>Как проверять себя</h4><span>критерии на будущее</span></div>
      <div class="pcard" onclick="goTab('ai')"><b>4</b><h4>Скопировать</h4><span>отдать нейронке вместе с контекстом</span></div>
    </div></div></section>

  <section class="sec"><div class="in"><div class="eb">последний шаг перед началом</div><h2 class="t">Когда стартует твой год</h2>
    <p class="lead">Теперь, когда ты понимаешь, как всё устроено, выбери дату старта. Тетрадь сама подпишет 12 месяцев.</p>
    <div class="datecard"><div><label class="l" style="margin-top:0">Дата старта</label>
      <input type="date" value="${esc(S.start)}" onchange="setStart(this.value)">
      <p style="margin-top:10px;font-size:14px;color:var(--mu);line-height:1.5">${e?'Твой год идёт с '+fmt(startD())+' по '+fmt(e):'Дату можно выбрать и позже'}</p></div></div>
    ${nextBtn('s1','Далее: шаг 1, желания')}</div></section>`;
}

function vS1(){
  return `<section class="sec"><div class="in">${head('шаг 1','Истинные желания','Отвечай развёрнуто, лучше голосом с последующей расшифровкой. Эти ответы ты подгрузишь в нейросеть.')}
  ${Q1.map((q,i)=>`<div class="q"><div class="n">${i+1}</div><div><p>${esc(q)}</p><textarea oninput="setW(${i},this.value)" placeholder="Твой ответ">${esc(S.wishes[i])}</textarea></div></div>`).join('')}
  <div style="margin-top:20px"><button class="btn fill" onclick="goTab('s2')">К шагу 2: цели</button></div></div></section>`;
}

function vS2(){
  const over=S.goals.length>6;
  return `<section class="sec"><div class="in">${head('шаг 2','Цели','Рекомендую не больше 6 целей. Для каждой определи, как поймёшь, что она достигнута, и какое одно маленькое действие будешь делать раз в неделю целый год.')}
  ${over?'<div class="warn">Целей больше 6. Подумай, какие можно убрать или объединить.</div>':''}
  ${S.goals.map((g,i)=>`<div class="fr gcard"><div class="fi">
    <div class="gh"><span class="tag inv">Цель ${i+1}</span>${S.mainId===g.id?'<span class="tag ac">главная</span>':''}
      <label class="row" style="margin-left:auto;font-size:13px;cursor:pointer"><input type="radio" name="main" ${S.mainId===g.id?'checked':''} onchange="setMain('${g.id}')"> главная цель</label>
      <button class="x" onclick="delGoal('${g.id}')" title="удалить">×</button></div>
    <label class="l">Цель</label><input type="text" value="${esc(g.name)}" oninput="setGoal('${g.id}','name',this.value)" placeholder="Например: выйти на новый уровень дохода">
    <label class="l">Как я пойму, что цель достигнута? Чёткая метрика</label><textarea style="min-height:70px" oninput="setGoal('${g.id}','metric',this.value)" placeholder="Конкретный результат, который можно проверить">${esc(g.metric)}</textarea>
    <label class="l">Одно маленькое действие раз в неделю, не пропуская, целый год</label><input type="text" value="${esc(g.weekly)}" oninput="setGoal('${g.id}','weekly',this.value)" placeholder="Например: раз в неделю смотреть статистику">
  </div></div>`).join('')}
  <div class="row wrap" style="margin-top:8px"><button class="dash" onclick="addGoal()">+ добавить цель</button><span style="flex:1"></span><button class="btn fill" onclick="goTab('rev')">Далее: как проверять себя</button></div></div></section>`;
}

function vRev(){
  const items=[
   ['Каждое первое число','Разбираешь прошедший месяц и отвечаешь на три вопроса: где я недоработала, что получилось классно, чем я себя за это награжу.'],
   ['Каждую неделю','Сделала ли я своё маленькое еженедельное действие по каждой цели. Достаточно ответить себе да или нет.'],
   ['По метрике цели','Стала ли я ближе к тому, что написала в поле «как пойму, что цель достигнута».'],
   ['По ощущениям','Есть ли энергия и интерес. Если тяжело, это сигнал дать себе отдых, а потом вернуться.']
  ];
  return `<section class="sec"><div class="in">${head('как проверять себя','Критерии на будущее','Здесь ничего заполнять не нужно. Это памятка: по каким критериям ты будешь проверять свой год, когда начнёшь действовать. Сейчас достаточно заполнить желания и цели.')}
  <div class="opor" style="margin-top:26px">${items.map(([a,b])=>`<div class="st"><div><b>${a}</b><span>${b}</span></div></div>`).join('')}</div>
  <h3 class="sub">Какой результат считается хорошим</h3>

function goalMd(g,i){
  let t=`### Цель ${i+1}: ${gname(g,i)}${S.mainId===g.id?' (ГЛАВНАЯ)':''}\n`;
  t+=`- Как пойму, что цель достигнута: ${g.metric.trim()||'не заполнено'}\n- Одно действие, которое готова делать раз в неделю целый год: ${g.weekly.trim()||'не заполнено'}\n`;
  return t;
}
function fullMd(){
  const e=endD();
  let t=`## Мой период\n${e?fmt(startD())+' - '+fmt(e):'Дату старта я пока не выбрала'}\n\n`;
  t+=`## Мои истинные желания\n`;Q1.forEach((q,i)=>{t+=`\n**${q}**\n${S.wishes[i].trim()||'не заполнено'}\n`});
  t+=`\n## Мои цели\n\n`;S.goals.forEach((g,i)=>{t+=goalMd(g,i)+'\n'});
  return t;
}

function copy(text){
  const done=()=>toast('Скопировано');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,()=>fb(text,done))}else fb(text,done);
}
function fb(text,cb){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');cb()}catch(e){toast('Не удалось, выдели текст вручную')}ta.remove()}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',1800)}
function copyAll(){copy(PROMPT_HEAD+fullMd())}
